
searches:

  # ==========================================
  # SEARCH 1: FRANCE
  # ==========================================

  - name: "Graphic Designer - France"

    keywords:
      - "Graphic Designer"
      - "Graphic Design"
      - "Designer graphique"
      - "Graphiste"
      - "Visual Designer"
      - "Brand Designer"
      - "Digital Designer"

    location: "France"

    match_mode: any

    exclude:
      - "stage"
      - "stages"
      - "intern"
      - "internship"
      - "alternance"
      - "apprentissage"
      - "CDD"
      - "intérim"

    remote_only: false

    recipients: []

    max_results: 25

    enabled: true


  # ==========================================
  # SEARCH 2: JAKARTA, INDONESIA
  # ==========================================

  - name: "Graphic Designer - Jakarta"

    keywords:
      - "Graphic Designer"
      - "Graphic Design"
      - "Desainer Grafis"
      - "Desain Grafis"
      - "Visual Designer"
      - "Brand Designer"
      - "Digital Designer"

    location: "Jakarta, Indonesia"

    match_mode: any

    exclude:
      - "intern"
      - "internship"
      - "magang"
      - "trainee"

    remote_only: false

    recipients: []

    max_results: 25

    enabled: true


# ==========================================
# NOTIFICATIONS
# ==========================================

notifications:

  email:
    enabled: true

    recipients: []

    subject_prefix: "[Graphic Designer Job Alert]"

    host: "smtp.gmail.com"

    port: 587

    use_ssl: false

  ntfy:
    enabled: false

    server: "https://ntfy.sh"

    topic: ""

    priority: default


# ==========================================
# GENERAL SETTINGS
# ==========================================

settings:

  hours: 24

  request_delay_seconds: 3

  state_file: "state/seen_jobs.json"

  forget_after_days: 30
