
name: LinkedIn ilan taraması

# Runs manually or through cron-job.org using workflow_dispatch.
# GitHub's own schedule trigger is intentionally disabled.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Bildirim gönderme, sadece bulunanları logla"
        type: boolean
        default: false

      only_search:
        description: "Yalnızca adı bunu içeren aramayı çalıştır (boş = tümü)"
        type: string
        default: ""

      hours:
        description: "Kaç saat geriye bakılsın (boş = config değeri)"
        type: string
        default: ""

      max_results:
        description: "Kelime başına en fazla ilan (boş = config değeri)"
        type: string
        default: ""

# Prevent overlapping searches on the same branch.
concurrency:
  group: job-hunt-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest

    # Maximum execution time.
    timeout-minutes: 25

    steps:

      # --------------------------------------
      # 1. Download repository
      # --------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # --------------------------------------
      # 2. Install Python
      # --------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # --------------------------------------
      # 3. Install dependencies
      # --------------------------------------

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # --------------------------------------
      # 4. Run LinkedIn Job Hunter
      # --------------------------------------

      - name: Hunt for jobs
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

          DRY_RUN: ${{ inputs.dry_run }}
          ONLY_SEARCH: ${{ inputs.only_search }}
          HOURS: ${{ inputs.hours }}
          MAX_RESULTS: ${{ inputs.max_results }}

        shell: bash
        run: |
          set -euo pipefail

          args=(--config config.yaml)

          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi

          if [[ -n "$ONLY_SEARCH" ]]; then
            args+=(--only-search "$ONLY_SEARCH")
          fi

          if [[ -n "$HOURS" ]]; then
            args+=(--hours "$HOURS")
          fi

          if [[ -n "$MAX_RESULTS" ]]; then
            args+=(--max-results "$MAX_RESULTS")
          fi

          python -m job_hunter "${args[@]}"

      # --------------------------------------
      # 5. Save seen jobs
      # --------------------------------------

      - name: Save seen jobs
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          STATE_FILE="state/seen_jobs.json"

          if [[ ! -f "$STATE_FILE" ]]; then
            echo "No state file found. Nothing to save."
            exit 0
          fi

          if [[ -z "$(git status --porcelain -- "$STATE_FILE")" ]]; then
            echo "No changes to the job history."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep this run's state safe while updating the repository.
          cp "$STATE_FILE" "${RUNNER_TEMP}/mine.json"

          for attempt in 1 2 3 4; do

            echo "Saving job history: attempt ${attempt}"

            # Fetch the latest repository state.
            if ! git fetch -q origin "$GITHUB_REF_NAME"; then
              echo "Fetch failed. Retrying..."
              sleep $((attempt * 5))
              continue
            fi

            # Synchronize with the latest remote version.
            if ! git reset -q --hard "origin/$GITHUB_REF_NAME"; then
              echo "Reset failed. Retrying..."
              sleep $((attempt * 5))
              continue
            fi

            # Merge this run's discoveries with existing history.
            python scripts/merge_state.py \
              "${RUNNER_TEMP}/mine.json" \
              "$STATE_FILE" \
              "$STATE_FILE"

            if [[ -z "$(git status --porcelain -- "$STATE_FILE")" ]]; then
              echo "Job history is already up to date."
              exit 0
            fi

            git add "$STATE_FILE"

            git commit -m \
              "chore: update seen jobs [skip ci]"

            # Push updated job history.
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Job history saved successfully."
              exit 0
            fi

            echo "Push failed. Retrying..."
            sleep $((attempt * 2))

          done

          echo "Unable to save job history after 4 attempts." >&2
          exit 1
